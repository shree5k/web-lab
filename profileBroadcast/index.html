<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1366, initial-scale=1.0">
  <title>Profile Broadcast</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../thoughtNoteModalPage/styles.css">
  <script src="../thoughtNoteModalPage/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
</head>
<body>
  <div class="header">
    <a href="../index.html">web lab / </a><span class="pageTitleText">profileBroadcast</span>
  </div>
  <div class="app-container">
    <div class="content-viewport"> 
      <div class="sidebar">
        <img class="logo" src="/assets/images/logo.png" alt="Logo">
        <div class="nav">
          <img src="/assets/images/12.png" class="active" alt="Home">
          <img src="/assets/icons/Icon.svg" alt="Search">
          <img src="/assets/icons/hs tv.svg" alt="TV">
          <img src="/assets/icons/hs movies.svg" alt="Movies">
          <img src="/assets/icons/hs sports.svg" alt="Sports">
          <img src="/assets/icons/category.svg" alt="Categories">
        </div>
      </div>
      <div class="main"> 
        <div class="header-flex">
          <div class="header-info">
            <div class="plan-row">
              <span class="plan">Premium 3 Month Plan</span>
              <div class="chevron"></div>
            </div>
            <span class="phone">+91 8********0</span>
          </div>
          <button class="help-settings">
            <img src="/assets/icons/settings.svg" alt="Settings">
            Help & Settings
          </button>
        </div>
        <div class="profiles-header">
          <div class="section-title">Profiles</div>
          <button class="edit-profile-btn">
            <img src="/assets/icons/edit.svg" alt="Edit Icon">Edit
          </button>
        </div>
        <div class="profiles-row-auto">
          <div class="profile-auto">
            <div class="avatar-auto selected" style="background-image:url('/assets/images/12.png')">
            </div>
            <div class="name-auto">SK</div>
          </div>
          <div class="profile-auto">
            <div class="avatar-auto" style="background-image:url('/assets/images/37.png')"></div>
            <div class="name-auto">Hari</div>
          </div>
          <div class="profile-auto">
            <div class="avatar-auto" style="background-image:url('/assets/images/24.png')"></div>
            <div class="name-auto">Vivek</div>
          </div>
          <div class="profile-auto">
            <div class="avatar-auto" style="background-image:url('/assets/images/19_rebranded.png')"></div>
            <div class="name-auto">Kids</div>
          </div>
          <div class="profile-auto add">
            <div class="avatar-auto"></div>
            <div class="name-auto">Add</div>
          </div>
        </div>
        <div class="watchlist-section-auto">
          <div class="section-title">Watchlist</div>
          <div class="watchlist-row-auto">
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=107Kai87ekNV-Svd578OTLVsIaU2QB_Gp&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=10JlIuMQe8nLh9ZssmI-d5huAikPNIDTs&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=10mNpf9KsaoLV0_yPQWJ4SCQlCTATp-AB&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=11IHb7P-pVZe0qQ9_Te3ujoYmae8Fxdvh&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=12H3L2Vx-sSt6tvAQQaRyjXzP_es47qKW&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=137h3EF1IdwqaQBT1F6cYJTwvQCMmA93S&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=143iK41S3q5-yR1USUR8ZbSqEZ7rAAqFc&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=14lMAxidbShs82vCLKVSHGia4MjL7cPN4&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=14y2lML3LeVUo5XjD93MEC-G4qsBTNeEi&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=16YS7CKgetklh6NsYVXZ0MWSQTnj_X8p5&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=178zaXM6K4WkOf9nFvV6p_-TxhuqTjd7x&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=18O4pAx2qAj9AK4NeQfcV81RqMzUjj3ln&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=1BCxYlBxlhmYezz_ybBN3VFt1e7j_HCpq&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=1DAzYbwMZfeoxKrJty8-xlnvRSILLXFMo&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=1G7A7qSwg24_qGMVrNLJRjTXy0pebHwA6&sz=w500')"></div>
            <div class="watchlist-item-auto" style="background-image:url('https://drive.google.com/thumbnail?id=1Gl7aPb15whzU5KGRAvEoO5gctFqlSl0V&sz=w500')"></div>
          </div>
        </div>
      </div>

      <div id="imageZoomOverlay" class="image-zoom-overlay" style="display: none;">
        <div class="zoom-content-container">
          <div id="zoomedProfileName" class="zoomed-profile-recommendation"></div>
          <div id="enlargedImagesWrapper"></div>
        </div>
      </div>

      <div id="toastNotification" class="toast-notification">Poster Pinned!</div>
    </div>
  </div>

  <div id="customContextMenu">
    <div class="context-menu-item" id="addNoteToProfileBtn">Add to Profile Broadcast</div>
  </div>

  <div id="cd-icon" title="Open Thought Note">💿</div>

  <div id="modal-page">
      <div class="modal-header">
          <span class="modal-title">Thought Note</span>
          <button id="close-modal-btn" aria-label="Close modal">×</button>
      </div>
      <div class="modal-content-container">
          <p>Loading notes...</p>
      </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const contextMenu = document.getElementById('customContextMenu');
      const addNoteToProfileBtn = document.getElementById('addNoteToProfileBtn');
      const watchlistItems = document.querySelectorAll('.watchlist-item-auto');
      const mainContentArea = document.querySelector('.main');
      const toastNotification = document.getElementById('toastNotification');
      let toastTimeout;
      
      let currentWatchlistItemUrl = null;

      const imageZoomOverlay = document.getElementById('imageZoomOverlay');
      const enlargedImagesWrapper = document.getElementById('enlargedImagesWrapper');
      const zoomedProfileNameDiv = document.getElementById('zoomedProfileName');

      function showToast(message) {
        toastNotification.textContent = message;
        toastNotification.classList.add('show');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastNotification.classList.remove('show');
        }, 3000);
      }

      function hideContextMenu() {
        if (!contextMenu.classList.contains('visible')) return;
        const onHideTransitionEnd = () => {
          contextMenu.style.display = 'none';
          currentWatchlistItemUrl = null;
        };
        contextMenu.addEventListener('transitionend', onHideTransitionEnd, { once: true });
        setTimeout(() => {
          if (contextMenu.style.display !== 'none' && !contextMenu.classList.contains('visible')) onHideTransitionEnd();
        }, 250);
        contextMenu.classList.remove('visible');
      }

      watchlistItems.forEach(item => {
        item.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (contextMenu.classList.contains('visible')) {
            contextMenu.classList.remove('visible');
            contextMenu.style.display = 'none';
          }
          currentWatchlistItemUrl = item.style.backgroundImage;
          contextMenu.style.display = 'block';
          const menuWidth = contextMenu.offsetWidth;
          const menuHeight = contextMenu.offsetHeight;
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          let topPosition = e.clientY;
          let leftPosition = e.clientX;
          if (topPosition + menuHeight > viewportHeight) topPosition = viewportHeight - menuHeight - 5;
          if (leftPosition + menuWidth > viewportWidth) leftPosition = viewportWidth - menuWidth - 5;
          contextMenu.style.top = `${topPosition < 5 ? 5 : topPosition}px`;
          contextMenu.style.left = `${leftPosition < 5 ? 5 : leftPosition}px`;
          let originX = Math.max(0, Math.min(e.clientX - leftPosition, menuWidth));
          let originY = Math.max(0, Math.min(e.clientY - topPosition, menuHeight));
          contextMenu.style.transformOrigin = `${originX}px ${originY}px`;
          void contextMenu.offsetHeight; 
          contextMenu.classList.add('visible');
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#customContextMenu') && contextMenu.classList.contains('visible')) hideContextMenu();
      });
      
      if (mainContentArea) {
        mainContentArea.addEventListener('scroll', () => { if (contextMenu.classList.contains('visible')) hideContextMenu(); });
      }

      addNoteToProfileBtn.addEventListener('click', () => {
        if (currentWatchlistItemUrl) {
          const selectedProfileAvatar = document.querySelector('.profile-auto .avatar-auto.selected');
          if (selectedProfileAvatar) {
            const existingPosters = selectedProfileAvatar.querySelectorAll('.profile-note-poster');
            if (existingPosters.length >= 2) {
              showToast("Broadcast more tomorrow!");
              hideContextMenu();
              return;
            }
            const posterToDemote = selectedProfileAvatar.querySelector('.profile-note-poster.primary');
            if (posterToDemote) {
              posterToDemote.classList.remove('primary');
              posterToDemote.classList.add('secondary');
            }
            const newPoster = document.createElement('div');
            newPoster.classList.add('profile-note-poster', 'primary');
            newPoster.style.backgroundImage = currentWatchlistItemUrl;
            selectedProfileAvatar.appendChild(newPoster);
            setTimeout(() => newPoster.classList.add('landed'), 10);
            showToast("Poster Pinned!");
          } else {
            showToast("Select a profile first!");
          }
        }
        hideContextMenu();
      });

      const profileAutos = document.querySelectorAll('.profile-auto');
      profileAutos.forEach(profileDiv => {
          profileDiv.addEventListener('click', function(event) {
              if (event.target.closest('.profile-note-poster') || this.classList.contains('add')) return;
              document.querySelectorAll('.avatar-auto.selected').forEach(selectedAv => {
                  selectedAv.classList.remove('selected');
                  const checkmark = selectedAv.querySelector('.checkmark-selected-indicator');
                  if (checkmark) checkmark.remove();
              });
              const avatar = this.querySelector('.avatar-auto');
              if (avatar) {
                  avatar.classList.add('selected');
                  const checkmarkIndicator = document.createElement('div');
                  checkmarkIndicator.classList.add('checkmark-selected-indicator');
                  const checkmarkImg = document.createElement('img');
                  checkmarkImg.src = '/assets/icons/check.svg';
                  checkmarkImg.alt = 'Selected Profile';
                  checkmarkIndicator.appendChild(checkmarkImg);
                  avatar.appendChild(checkmarkIndicator);
              }
          });
      });

      const firstProfileDiv = document.querySelector('.profile-auto:not(.add)');
      if (firstProfileDiv) {
          const firstAvatar = firstProfileDiv.querySelector('.avatar-auto');
          if (firstAvatar) {
              if (!firstAvatar.classList.contains('selected')) firstAvatar.classList.add('selected');
              const existingCheckmark = firstAvatar.querySelector('.checkmark-selected-indicator');
              if (!existingCheckmark) {
                const checkmarkIndicator = document.createElement('div');
                checkmarkIndicator.classList.add('checkmark-selected-indicator');
                const checkmarkImg = document.createElement('img');
                checkmarkImg.src = '/assets/icons/check.svg';
                checkmarkImg.alt = 'Selected Profile';
                checkmarkIndicator.appendChild(checkmarkImg);
                firstAvatar.appendChild(checkmarkIndicator);
              }
          }
      }

      function showEnlargedImage(avatarElement, recommendationText) {
        enlargedImagesWrapper.innerHTML = '';
        
        const postersToShow = [
          avatarElement.querySelector('.profile-note-poster.primary'),
          avatarElement.querySelector('.profile-note-poster.secondary')
        ].filter(Boolean);

        postersToShow.forEach(posterDiv => {
          const bgImage = window.getComputedStyle(posterDiv).backgroundImage;
          const cleanUrl = bgImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
          
          // 1. Create the main container for the poster item
          const posterItemContainer = document.createElement('div');
          posterItemContainer.className = 'enlarged-poster-item';

          // 2. Create the image
          const img = document.createElement('img');
          img.src = cleanUrl;
          img.alt = "Enlarged Poster";
          img.className = 'enlarged-image';
          
          // 3. Create the actions container
          const actionsContainer = document.createElement('div');
          actionsContainer.className = 'enlarged-poster-actions';

          // 4. Create the 'Watch Now' button
          const watchBtn = document.createElement('button');
          watchBtn.className = 'zoom-action-btn watch-now';
          watchBtn.innerHTML = `<img src="/assets/icons/play.svg" alt="Play"><span>Watch Now</span>`;

          // 5. Create the 'Add to Watchlist' button with its own class and no visible text
          const addBtn = document.createElement('button');
          addBtn.className = 'zoom-action-btn add-watchlist';
          addBtn.innerHTML = `<img src="/assets/icons/add.svg" alt="Add to Watchlist"><span class="visually-hidden">Add to Watchlist</span>`;

          // 6. Append buttons to their container
          actionsContainer.appendChild(watchBtn);
          actionsContainer.appendChild(addBtn);

          // 7. Append the image and actions container to the main item container
          posterItemContainer.appendChild(img);
          posterItemContainer.appendChild(actionsContainer);
          
          // 8. Append the complete item to the main wrapper
          enlargedImagesWrapper.appendChild(posterItemContainer);
        });

        zoomedProfileNameDiv.textContent = recommendationText || "Recommendations";
        imageZoomOverlay.style.display = 'flex';
        setTimeout(() => imageZoomOverlay.classList.add('visible'), 10); 
        if (mainContentArea) mainContentArea.style.overflowY = 'hidden'; 
      }

      function hideEnlargedImage() {
        imageZoomOverlay.classList.remove('visible');
        setTimeout(() => {
          imageZoomOverlay.style.display = 'none';
          enlargedImagesWrapper.innerHTML = '';
          zoomedProfileNameDiv.textContent = '';
          if (mainContentArea) mainContentArea.style.overflowY = 'auto';
        }, 400);
      }

      if (mainContentArea) {
          mainContentArea.addEventListener('click', function(event) {
              if (imageZoomOverlay.classList.contains('visible')) return;
              const notePoster = event.target.closest('.profile-note-poster');
              if (notePoster) {
                  event.preventDefault();
                  event.stopPropagation();
                  const avatarOfPoster = notePoster.closest('.avatar-auto');
                  if (avatarOfPoster) {
                    let recommendationText = "Recommendations";
                    const profileAutoDiv = avatarOfPoster.closest('.profile-auto');
                    if (profileAutoDiv) {
                        const nameElement = profileAutoDiv.querySelector('.name-auto');
                        if (nameElement) {
                            const name = nameElement.textContent.trim();
                            if (name) recommendationText = `${name}'s Recommendations`;
                        }
                    }
                    showEnlargedImage(avatarOfPoster, recommendationText);
                  }
              }
          });
      }
      
      imageZoomOverlay.addEventListener('click', (event) => {
        if (event.target === imageZoomOverlay || event.target === document.querySelector('.zoom-content-container')) {
             hideEnlargedImage();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && imageZoomOverlay.classList.contains('visible')) hideEnlargedImage();
      });

    });
  </script>
</body>
</html>
