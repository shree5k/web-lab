    <div id="cd-icon" title="Open Thought Note">💿</div>

    <div id="modal-page">
        <div class="modal-header">
            <span class="modal-title">Thought Note</span>
            <button id="close-modal-btn" aria-label="Close modal">×</button>
        </div>
        <div class="modal-content-container">
            <p>Loading notes...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.querySelector('.card-grid');
            const contentViewport = document.querySelector('.content-viewport');
            const mainContentSflEl = document.querySelector('.main-content-sfl');
            const refreshTextEl = document.querySelector('.refresh-text');
            const refreshTitleEl = document.querySelector('.refresh-title');
            const refreshSubtitleEl = document.querySelector('.refresh-subtitle');
            const refreshSpinnerEl = document.querySelector('.refresh-spinner');
            const heroReveal = document.querySelector('.hero-reveal');
            const statusMessage = document.querySelector('.content-viewport > .status-message');
            const lightGlintOverlay = document.querySelector('.content-viewport > .light-glint-overlay');
            const refreshArea = document.querySelector('.content-viewport > .refresh-area');
            const refreshContent = refreshArea ? refreshArea.querySelector('.refresh-content') : null;
            const sidebarEl = document.querySelector('.sidebar');
            const cdIconGlobal = document.getElementById('cd-icon');
            const thoughtNoteModal = document.getElementById('modal-page');
            const thoughtNoteModalCloseButton = document.getElementById('close-modal-btn');

            const REVEAL_AREA_CSS_VAR_HEIGHT_STR = getComputedStyle(document.documentElement).getPropertyValue('--reveal-height').trim();
            const REVEAL_AREA_CSS_VAR_HEIGHT = parseInt(REVEAL_AREA_CSS_VAR_HEIGHT_STR, 10);
            
            const PULL_THRESHOLD_ENGAGE = 80; 
            const PULL_THRESHOLD_DISENGAGE = 60; 
            const MAX_PULL = REVEAL_AREA_CSS_VAR_HEIGHT; 

            const BOTTOM_THRESHOLD = 100;
            const EXTRA_HEIGHT_DURING_REFRESH_ANIMATION = 12; 

            const resetTransform = 'translateY(0px)';

            let isPulling = false; 
            let pullDistance = 0;  
            let isRefreshing = false;
            let startY = 0;
            let isDragging = false; 
            let lastScrollTop = 0;
            let isNearBottom = false;
            let statusMessageTimeout = null;
            let isSnapEngaged = false; 

            let currentAnimatedPullDistance = 0; 
            let pullAnimationRequest = null;     
            const PULL_ANIMATION_EASING_FACTOR = 0.2; 


            function applyElementTransitions(element, properties) {
                if (element) element.style.transition = properties;
            }
            
            function removeElementTransitions(element) {
                if (element) element.style.transition = 'none';
            }

            function startPullAnimationLoop() {
                if (!pullAnimationRequest) {
                    pullAnimationRequest = requestAnimationFrame(pullAnimationTick);
                }
            }

            function stopPullAnimationLoop() {
                if (pullAnimationRequest) {
                    cancelAnimationFrame(pullAnimationRequest);
                    pullAnimationRequest = null;
                }
            }

            function pullAnimationTick() {
                let targetPullDistance;
                if (isSnapEngaged) {
                    targetPullDistance = MAX_PULL;
                } else {
                    targetPullDistance = Math.min(pullDistance, MAX_PULL); 
                }

                const diff = targetPullDistance - currentAnimatedPullDistance;

                if (Math.abs(diff) < 0.5 && !isDragging) { 
                    currentAnimatedPullDistance = targetPullDistance;
                    stopPullAnimationLoop();
                } else {
                    currentAnimatedPullDistance += diff * PULL_ANIMATION_EASING_FACTOR;
                    pullAnimationRequest = requestAnimationFrame(pullAnimationTick);
                }
                
                const transformValue = `translateY(-${currentAnimatedPullDistance}px)`;
                if (sidebarEl) sidebarEl.style.transform = transformValue;
                if (mainContentSflEl) mainContentSflEl.style.transform = transformValue;
                if (refreshArea) refreshArea.style.transform = transformValue;

                const blurRatio = Math.min(currentAnimatedPullDistance / PULL_THRESHOLD_ENGAGE, 1.5); 
                const blurAmount = Math.min(blurRatio * 3, 5); 
                const blurValue = `blur(${blurAmount}px)`;
                if(grid) grid.style.filter = blurValue;
                if (sidebarEl) sidebarEl.style.filter = blurValue;

                if (isSnapEngaged) {
                    if (refreshTitleEl) refreshTitleEl.textContent = 'Release to get recommendations';
                    if (refreshSubtitleEl) refreshSubtitleEl.textContent = 'We\'ll find something perfect for you';
                    if (refreshTextEl && !refreshTextEl.classList.contains('pull-active')) {
                        refreshTextEl.classList.add('pull-active');
                    }
                } else {
                    if (refreshTitleEl) refreshTitleEl.textContent = 'Pull up for recommendations';
                    if (refreshSubtitleEl) refreshSubtitleEl.textContent = 'Release to get movie suggestions';
                    if (refreshTextEl) refreshTextEl.classList.remove('pull-active');
                }
            }

            function resetPullToRefreshState(immediate = false) {
                stopPullAnimationLoop(); 

                if (immediate) {
                    removeElementTransitions(mainContentSflEl);
                    removeElementTransitions(sidebarEl);
                    removeElementTransitions(refreshArea);
                    removeElementTransitions(grid);
                } else {
                    applyElementTransitions(mainContentSflEl, 'transform 0.3s ease');
                    applyElementTransitions(sidebarEl, 'transform 0.3s ease, filter 0.4s ease');
                    applyElementTransitions(refreshArea, 'transform 0.3s ease, height 0.3s ease, bottom 0.3s ease');
                    applyElementTransitions(grid, 'filter 0.4s ease, opacity 0.3s ease');
                }

                if (sidebarEl) { sidebarEl.style.transform = resetTransform; sidebarEl.style.filter = 'blur(0px)'; }
                if (mainContentSflEl) mainContentSflEl.style.transform = resetTransform;
                if (refreshArea) {
                    refreshArea.style.transform = resetTransform;
                    refreshArea.style.height = REVEAL_AREA_CSS_VAR_HEIGHT_STR;
                    refreshArea.style.bottom = `calc(${REVEAL_AREA_CSS_VAR_HEIGHT_STR} * -1)`;
                    refreshArea.style.paddingBottom = ''; 
                }
                if (grid) { 
                    grid.style.filter = 'blur(0px)';
                }

                if (refreshTextEl) refreshTextEl.classList.remove('pull-active');
                if (refreshSpinnerEl) refreshSpinnerEl.style.display = 'none';
                if (refreshTitleEl) refreshTitleEl.textContent = 'Pull up for recommendations';
                if (refreshSubtitleEl) refreshSubtitleEl.textContent = 'Release to get movie suggestions';
                
                if (immediate && mainContentSflEl) mainContentSflEl.offsetHeight; 
                
                isPulling = false;
                isSnapEngaged = false; 
                currentAnimatedPullDistance = 0; 
                pullDistance = 0; 
            }

            const updateScrollState = () => {
                if (isRefreshing || isDragging || !grid) return;
                const scrollTop = grid.scrollTop;
                const scrollHeight = grid.scrollHeight;
                const clientHeight = grid.clientHeight;
                const distanceFromBottom = scrollHeight - scrollTop - clientHeight;
                const scrollDirection = scrollTop > lastScrollTop ? 'down' : 'up';
                const wasNearBottom = isNearBottom;
                isNearBottom = distanceFromBottom < BOTTOM_THRESHOLD;
                if (contentViewport) contentViewport.classList.toggle('near-bottom', isNearBottom);
                if (isNearBottom && !wasNearBottom && scrollDirection === 'down') showFeelingLuckyMessage();
                else if ((!isNearBottom && wasNearBottom && scrollDirection === 'up') || (scrollDirection === 'up' && statusMessage && statusMessage.classList.contains('show'))) {
                    hideFeelingLuckyMessage(!isNearBottom && wasNearBottom);
                }
                lastScrollTop = scrollTop;
            };
            
            const showFeelingLuckyMessage = () => {
                if (isPulling || isRefreshing || isDragging || !statusMessage) return;
                if (statusMessageTimeout) clearTimeout(statusMessageTimeout);
                const messages = ['Feeling lucky? Pull Up<img src="../assets/icons/up.svg" alt="Up arrow" class="emoji" style="width: 1.5em; height: 1.5em; vertical-align: middle;">', 'Surprise me! Pull Up<img src="../assets/icons/up.svg" alt="Up arrow" class="emoji" style="width: 1.5em; height: 1.5em; vertical-align: middle;">'];
                statusMessage.innerHTML = messages[Math.floor(Math.random() * messages.length)];
                statusMessage.classList.remove('slide-up'); statusMessage.classList.add('show');
                statusMessageTimeout = setTimeout(() => { if (statusMessage.classList.contains('show')) hideFeelingLuckyMessage(false); }, 4000);
            };

            const hideFeelingLuckyMessage = (immediate = false) => {
                if (!statusMessage) return;
                if (statusMessageTimeout) { clearTimeout(statusMessageTimeout); statusMessageTimeout = null; }
                if (immediate) {
                    statusMessage.classList.add('slide-up');
                    setTimeout(() => statusMessage.classList.remove('show', 'slide-up'), 200);
                } else statusMessage.classList.remove('show');
            };

            const triggerRefresh = () => {
                if (isRefreshing || !refreshArea || !refreshContent) return;
                isRefreshing = true; isPulling = false; 
                hideFeelingLuckyMessage(true);

                const desiredPaddingBottomDuringRefresh = '0px'; 
                const originalInlinePaddingBottom = refreshArea.style.paddingBottom; 

                if (refreshTitleEl) refreshTitleEl.textContent = 'Finding recommendations...';
                if (refreshSubtitleEl) refreshSubtitleEl.textContent = ''; 
                if (refreshSpinnerEl) refreshSpinnerEl.style.display = 'block';
                if (refreshTextEl && !refreshTextEl.classList.contains('pull-active')) refreshTextEl.classList.add('pull-active');
                
                refreshArea.style.paddingBottom = desiredPaddingBottomDuringRefresh;

                requestAnimationFrame(() => { 
                    const refreshAreaVerticalPadding = parseFloat(getComputedStyle(refreshArea).paddingTop) + parseFloat(getComputedStyle(refreshArea).paddingBottom);
                    const contentHeight = refreshContent.offsetHeight;
                    const dynamicHeightForRefresh = contentHeight + refreshAreaVerticalPadding + EXTRA_HEIGHT_DURING_REFRESH_ANIMATION;
                    const upwardShift = dynamicHeightForRefresh; 

                    const mainContentTransformTarget = `translateY(-${upwardShift}px)`;

                    applyElementTransitions(mainContentSflEl, 'transform 0.3s ease');
                    applyElementTransitions(sidebarEl, 'transform 0.3s ease, filter 0.3s ease'); 

                    if (mainContentSflEl) mainContentSflEl.style.transform = mainContentTransformTarget;
                    if (sidebarEl) sidebarEl.style.transform = mainContentTransformTarget;

                    if (refreshArea) {
                        applyElementTransitions(refreshArea, 'transform 0.3s ease, height 0.3s ease, bottom 0.3s ease');
                        refreshArea.style.transform = resetTransform; 
                        refreshArea.style.bottom = '0px';             
                        refreshArea.style.height = `${dynamicHeightForRefresh}px`; 
                    }

                    setTimeout(() => { 
                        const moviesData = [
                             { title: "The Intern", poster: "https://drive.google.com/thumbnail?id=10mNpf9KsaoLV0_yPQWJ4SCQlCTATp-AB&sz=w500" },
                             { title: "Interstellar", poster: "https://drive.google.com/thumbnail?id=1BCxYlBxlhmYezz_ybBN3VFt1e7j_HCpq&sz=w500" },
                             { title: "Ford vs Ferrari", poster: "https://drive.google.com/thumbnail?id=107Kai87ekNV-Svd578OTLVsIaU2QB_Gp&sz=w500" },
                             { title: "Joker", poster: "https://drive.google.com/thumbnail?id=10JlIuMQe8nLh9ZssmI-d5huAikPNIDTs&sz=w500" }
                        ];
                        const randomMovie = moviesData[Math.floor(Math.random() * moviesData.length)];
                        if (heroReveal) {
                            const heroPoster = heroReveal.querySelector('.hero-poster');
                            const heroTitle = heroReveal.querySelector('.hero-title');
                            if (heroPoster) heroPoster.src = randomMovie.poster;
                            if (heroTitle) heroTitle.textContent = randomMovie.title;
                        }
                        
                        if (refreshArea) {
                            refreshArea.style.paddingBottom = originalInlinePaddingBottom || ''; 
                        }
                        
                        if (grid) {
                            removeElementTransitions(grid); 
                            grid.classList.add('grid-hidden');
                            void grid.offsetHeight; 
                        }

                        applyElementTransitions(mainContentSflEl, 'transform 0.3s ease');
                        applyElementTransitions(sidebarEl, 'transform 0.3s ease, filter 0.4s ease'); 
                        applyElementTransitions(refreshArea, 'transform 0.3s ease, height 0.3s ease, bottom 0.3s ease');


                        if (sidebarEl) { sidebarEl.style.transform = resetTransform; sidebarEl.style.filter = 'blur(0px)';}
                        if (mainContentSflEl) mainContentSflEl.style.transform = resetTransform;
                        if (grid) grid.style.filter = 'blur(0px)'; 

                        if (refreshArea) { 
                            refreshArea.style.height = REVEAL_AREA_CSS_VAR_HEIGHT_STR;
                            refreshArea.style.bottom = `calc(${REVEAL_AREA_CSS_VAR_HEIGHT_STR} * -1)`;
                            refreshArea.style.transform = resetTransform; 
                            if (refreshTitleEl) refreshTitleEl.textContent = 'Pull up for recommendations';
                            if (refreshSubtitleEl) refreshSubtitleEl.textContent = 'Release to get movie suggestions';
                            if (refreshSpinnerEl) refreshSpinnerEl.style.display = 'none';
                            if (refreshTextEl) refreshTextEl.classList.remove('pull-active');
                        }
                        
                        if(lightGlintOverlay) lightGlintOverlay.classList.add('is-wiping');
                        if (heroReveal) heroReveal.classList.add('is-visible');

                        isRefreshing = false; 
                        pullDistance = 0; 
                        currentAnimatedPullDistance = 0; 
                        isSnapEngaged = false; 
                        
                    }, 2000); 
                }); 
            };

            const hideHero = () => {
                if (heroReveal) heroReveal.classList.remove('is-visible');
                if (grid) {
                    applyElementTransitions(grid, 'filter 0.4s ease, opacity 0.3s ease');
                    grid.classList.remove('grid-hidden');
                    grid.style.filter = 'blur(0px)';
                }
                if(lightGlintOverlay) lightGlintOverlay.classList.remove('is-wiping');
                resetPullToRefreshState(true); 
                isRefreshing = false;
            };

            if (grid) {
                let scrollTimeout = null;
                grid.addEventListener('scroll', () => {
                    if (isRefreshing) return;
                    if (scrollTimeout) clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(updateScrollState, 16);
                });
            }

            const handleDragStart = (clientY) => {
                if (isRefreshing || isDragging || !grid || (heroReveal && heroReveal.classList.contains('is-visible'))) return false;
                const isAtBottom = grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 5;
                if (isAtBottom) {
                    startY = clientY; 
                    isDragging = true; 
                    isPulling = false; 
                    isSnapEngaged = false; 
                    
                    stopPullAnimationLoop(); 
                    currentAnimatedPullDistance = 0; 
                    pullDistance = 0; 

                    removeElementTransitions(mainContentSflEl); 
                    removeElementTransitions(sidebarEl);
                    removeElementTransitions(refreshArea);
                    removeElementTransitions(grid);

                    const initialTransform = `translateY(-${currentAnimatedPullDistance}px)`;
                    if (sidebarEl) sidebarEl.style.transform = initialTransform;
                    if (mainContentSflEl) mainContentSflEl.style.transform = initialTransform;
                    if (refreshArea) refreshArea.style.transform = initialTransform;
                    if(grid) grid.style.filter = 'blur(0px)';


                    if (statusMessage && statusMessage.classList.contains('show')) hideFeelingLuckyMessage(true);
                    return true;
                } return false;
            };

            const handleDragMove = (clientY, event) => {
                if (!isDragging || isRefreshing) return;
                const deltaY = startY - clientY; 
                
                if (deltaY > 0) { 
                    if (!isPulling) { isPulling = true; } 
                    pullDistance = deltaY * (event.type.startsWith('touch') ? 1 : 0.8); 
                } else {
                    pullDistance = 0; 
                }

                if (!isSnapEngaged && pullDistance >= PULL_THRESHOLD_ENGAGE) {
                    isSnapEngaged = true;
                } else if (isSnapEngaged && pullDistance < PULL_THRESHOLD_DISENGAGE) {
                    isSnapEngaged = false;
                }
                
                startPullAnimationLoop(); 

                if (isPulling && event && event.cancelable && deltaY > 0) event.preventDefault(); 
            };

            const handleDragEnd = () => {
                if (!isDragging || isRefreshing) return;
                
                isDragging = false; 

                if (isSnapEngaged) {
                    stopPullAnimationLoop(); 

                    const finalTransform = `translateY(-${MAX_PULL}px)`;
                    const blurRatioFinal = Math.min(MAX_PULL / PULL_THRESHOLD_ENGAGE, 1.5);
                    const blurAmountFinal = Math.min(blurRatioFinal * 3, 5);
                    const finalBlurValue = `blur(${blurAmountFinal}px)`;

                    removeElementTransitions(mainContentSflEl); 
                    removeElementTransitions(sidebarEl);
                    removeElementTransitions(refreshArea);

                    if (sidebarEl) { sidebarEl.style.transform = finalTransform; sidebarEl.style.filter = finalBlurValue;}
                    if (mainContentSflEl) mainContentSflEl.style.transform = finalTransform;
                    if (refreshArea) {
                        refreshArea.style.transform = finalTransform; 
                        refreshArea.style.height = REVEAL_AREA_CSS_VAR_HEIGHT_STR; 
                        refreshArea.style.bottom = `calc(${REVEAL_AREA_CSS_VAR_HEIGHT_STR} * -1)`; 
                    }
                    if(grid) {
                        removeElementTransitions(grid);
                        grid.style.filter = finalBlurValue;
                    }
                    
                    if (refreshTextEl && !refreshTextEl.classList.contains('pull-active')) refreshTextEl.classList.add('pull-active');
                    if (refreshTitleEl) refreshTitleEl.textContent = 'Release to get recommendations';
                    if (refreshSubtitleEl) refreshSubtitleEl.textContent = 'We\'ll find something perfect for you';

                    triggerRefresh();
                } else {
                    stopPullAnimationLoop();
                    resetPullToRefreshState(false); 
                }
            };
            
            if (grid) {
                grid.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientY), { passive: true });
                grid.addEventListener('touchmove', (e) => { if (isDragging) handleDragMove(e.touches[0].clientY, e); }, { passive: false });
                grid.addEventListener('touchend', handleDragEnd);
                grid.addEventListener('touchcancel', handleDragEnd);
                grid.addEventListener('mousedown', (e) => { if (e.button === 0) handleDragStart(e.clientY); });
                document.addEventListener('mousemove', (e) => { if (isDragging) handleDragMove(e.clientY, e); });
                document.addEventListener('mouseup', (e) => { if (e.button === 0 && isDragging) handleDragEnd(); });
                grid.addEventListener('contextmenu', (e) => { if (isDragging) e.preventDefault(); });
            }

            const heroCloseButtonElement = document.querySelector('.hero-reveal .hero-close');
            if (heroCloseButtonElement) {
                heroCloseButtonElement.addEventListener('click', hideHero);
            }
            
            if (cdIconGlobal && thoughtNoteModal && thoughtNoteModalCloseButton) {
                cdIconGlobal.addEventListener('click', () => {
                    if (isRefreshing || isPulling || isSnapEngaged) { 
                        stopPullAnimationLoop(); 
                        resetPullToRefreshState(true); 
                        isRefreshing = false; 
                        isPulling = false; 
                    }
                });

                thoughtNoteModalCloseButton.addEventListener('click', () => {
                    if (grid && !(heroReveal && heroReveal.classList.contains('is-visible'))) {
                        applyElementTransitions(grid, 'filter 0.4s ease, opacity 0.3s ease');
                        grid.classList.remove('grid-hidden'); 
                        grid.style.filter = 'blur(0px)';
                    }
                });
            }

            if(lightGlintOverlay && lightGlintOverlay.querySelector('.light-source')) {
                lightGlintOverlay.querySelector('.light-source').addEventListener('animationend', () => {
                    if(lightGlintOverlay) lightGlintOverlay.classList.remove('is-wiping');
                });
            }
            
            if (refreshArea) {
                 refreshArea.style.height = REVEAL_AREA_CSS_VAR_HEIGHT_STR;
                 refreshArea.style.bottom = `calc(${REVEAL_AREA_CSS_VAR_HEIGHT_STR} * -1)`;
                 refreshArea.style.willChange = 'transform, height, bottom';
            }
            if (mainContentSflEl) mainContentSflEl.style.willChange = 'transform';
            if (sidebarEl) sidebarEl.style.willChange = 'transform, filter';
            if (grid) grid.style.willChange = 'opacity, filter';

            updateScrollState();
        });
    </script>
</body>
</html>
